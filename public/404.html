<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — MASCOTECH</title>
<style>
  :root {
    --bg-cyber: #0a0a0c;
    --bg-panel: #111115;
    --border-color: #22222a;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --vite-purple: #a855f7;
    --font-mono: 'Fira Code', 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg-cyber);
    color: var(--text-main);
    font-family: Inter, system-ui, -apple-system, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .card {
    max-width: 480px;
    text-align: center;
  }
  .code {
    font-family: var(--font-mono);
    color: var(--vite-purple);
    font-size: 0.85rem;
    letter-spacing: 2px;
    margin-bottom: 1rem;
    display: block;
  }
  h1 {
    font-size: clamp(2.5rem, 8vw, 4rem);
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 1rem;
    background: linear-gradient(135deg, #ffffff, var(--vite-purple), #6366f1);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p {
    color: var(--text-muted);
    font-size: 1.05rem;
    margin-bottom: 2rem;
    line-height: 1.6;
  }
  a.btn {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.9rem;
    padding: 0.85rem 1.75rem;
    border-radius: 8px;
    text-decoration: none;
    background: var(--text-main);
    color: var(--bg-cyber);
    font-weight: 600;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  a.btn:hover {
    transform: translateY(-2px);
    background: #ffffff;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="code">ERROR 404</span>
    <h1>Page not found</h1>
    <p>This route doesn't exist on MASCOTECH's site. It may have moved, or the link might be broken.</p>
    <a class="btn" href="/">Back to home</a>
  </div>
</body>
</html>
